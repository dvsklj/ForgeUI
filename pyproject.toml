[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "forgeui"
version = "0.1.0a3"
description = "Safe, model-generated dashboards rendered by FastAPI, Jinja2, and HTMX."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "ForgeUI contributors" }]
keywords = ["a2ui", "dashboard", "fastapi", "htmx", "llm", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
]

[project.urls]
Changelog = "https://github.com/dvsklj/ForgeUI/blob/main/CHANGELOG.md"
Documentation = "https://github.com/dvsklj/ForgeUI/tree/main/docs"
Homepage = "https://github.com/dvsklj/ForgeUI"
Issues = "https://github.com/dvsklj/ForgeUI/issues"
Repository = "https://github.com/dvsklj/ForgeUI.git"
Security = "https://github.com/dvsklj/ForgeUI/security/policy"

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
]
ollama = [
  "httpx>=0.28,<1",
]
http = [
  "httpx>=0.28,<1",
]
serve = [
  "uvicorn>=0.34,<1",
]
app = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]
dev = [
  "bandit[toml]>=1.9,<2",
  "beautifulsoup4>=4.13,<5",
  "hypothesis>=6.125,<7",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<7",
  "pytest-playwright>=0.6,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "twine>=7,<8",
]

[project.scripts]
forgeui = "forgeui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeui"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "browser: browser end-to-end tests",
  "docker: Docker integration tests",
  "ollama: tests requiring a live Ollama server",
  "slow: slow-running tests",
]

[tool.coverage.run]
branch = true
source = ["forgeui"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["forgeui"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
