# Optional overlay: docker compose -f compose.yaml -f compose.ollama.yaml up --build
services:
  forgeui:
    environment:
      FORGEUI_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    init: true
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 12
    restart: unless-stopped

volumes:
  ollama-models:
